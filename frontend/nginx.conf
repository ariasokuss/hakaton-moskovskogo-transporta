server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css;

    # API — на бэкенд внутри docker-сети.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /actuator/ { proxy_pass http://backend:8080; }

    # Кэш: index.html всегда проверяется заново (иначе браузер держит старую сборку после обновления);
    # файлы сборки с хешем в имени неизменны — кэшируются навсегда; видео и картинки — с проверкой.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /media/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SPA: любой путь отдаёт index.html, состояние экрана — в query-параметрах.
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
